    <script>
      // Ignore WebSocket and @vite/client errors per AI Studio environment constraints (HMR disabled in preview iframe)
      window.addEventListener('error', function (event) {
        if (
          (event.filename && event.filename.includes('@vite/client')) ||
          (event.message && (event.message.includes('WebSocket') || event.message.includes('ws://') || event.message.includes('wss://')))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        if (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://') || msg.includes('@vite/client')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
